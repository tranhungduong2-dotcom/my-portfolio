<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D7 | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-mark">D7</span>
        <span class="logo-tag">JAVA &bull; AUDIO</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
      <nav id="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-wrapper">
      <div class="contact-info">
        <span class="pill-tag">Collaborate</span>
        <h1>Let's Build or Compose Together</h1>
        <p>Looking for a Java backend engineer or custom music production for your next project? Drop a message below.</p>
      </div>

      <form id="contact-form" class="contact-form">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Alex Nguyen" required>

        <label for="topic">Inquiry Type</label>
        <select id="topic" name="topic">
          <option value="Java Development">Java Backend Development</option>
          <option value="Music Composition">Music Composition / Sound Design</option>
          <option value="Both">Both / General Inquiry</option>
        </select>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell me about your project or track..." required></textarea>

        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="form-status" class="status-msg"></p>
      </form>
    </section>
  </main>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 <strong>D7 Studio</strong> &mdash; Coded &amp; Composed from Scratch.</p>
      <div class="social-links">
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="SoundCloud"><i class="fab fa-soundcloud"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
